# Tells Bing and the other IndexNow engines (which ChatGPT search and Copilot use) that the site changed,
# after each push to main. Same request as `npm run site-ping` in addobari/tab-butler.
name: IndexNow
on:
  push:
    branches: [main]
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping IndexNow with every sitemap URL
        run: |
          sleep 90   # let GitHub Pages deploy first
          key=$(ls | grep -E '^[0-9a-f]{32}\.txt$' | sed 's/\.txt$//')
          urls=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed -e 's/<loc>//' -e 's/<\/loc>//' | jq -R . | jq -sc .)
          host=simmer.addobari.com
          body=$(jq -nc --arg h "$host" --arg k "$key" --argjson u "$urls" '{host:$h,key:$k,keyLocation:("https://"+$h+"/"+$k+".txt"),urlList:$u}')
          curl -sS -o /dev/null -w "IndexNow: %{http_code}\n" -H 'content-type: application/json; charset=utf-8' -d "$body" https://api.indexnow.org/indexnow
